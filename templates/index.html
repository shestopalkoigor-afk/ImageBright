<!DOCTYPE html>
<html>
<head>
    <title>Image Brightness Adjuster</title>
    <style>
        .container { 
            max-width: 800px;
            margin: 0 auto;
        }
        .image-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        input[type='range'] {
            width: 200px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Изменение яркости изображения</h1>
        <form method="post" enctype="multipart/form-data">
            <input type="file" name="image" accept="image/*">
            <br>
            Уровень яркости: <input type="range" name="brightness" min="0.1" max="2.0" step="0.1" value="1.0">
            <br><br>
            <button type="submit">Обработать</button>
        </form>
        <div id="result"></div>
    </div>
</body>
</html>
